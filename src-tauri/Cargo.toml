[package]
name = "aeolus"
version = "0.1.6"
description = "Aeolus - Roblox bootstrapper and client manager"
authors = ["Aeolus contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "aeolus_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
regex = "1"
once_cell = "1"
discord-rich-presence = "1.1.0"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
